name: DCO

# Every commit in a pull request must carry a Developer Certificate of Origin sign-off
# (git commit -s adds a "Signed-off-by: Name <email>" line). See CONTRIBUTING.md in the
# gramatr/.github repository. Merge commits and bot authors (Dependabot) are skipped.

on:
  pull_request:

permissions:
  contents: read

jobs:
  dco:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Every commit has a sign-off
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -u
          bad=0
          for c in $(git rev-list --no-merges "$BASE..$HEAD"); do
            author="$(git log -1 --format=%an "$c")"
            case "$author" in *'[bot]') continue ;; esac
            if ! git log -1 --format=%B "$c" | grep -qE '^Signed-off-by: .+ <.+@.+>$'; then
              echo "::error::commit ${c:0:12} has no Signed-off-by line (add one with git commit -s)"
              bad=1
            fi
          done
          exit "$bad"
