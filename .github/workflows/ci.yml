name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      server_ref:
        description: "guards-unified branch or tag whose app/scan.sh the drift check compares against (default: main)"
        required: false
        default: ""
  schedule:
    # Weekly, independent of any code change — catches newly-disclosed
    # CVEs in gitleaks / the vendored secret-guard-core image without
    # anyone having to remember to re-run a scan by hand.
    - cron: "0 7 * * 1"

permissions:
  contents: read
  issues: write

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Lint hook + vendor scripts
        run: |
          shopt -s nullglob
          files=(guards/hooks/*.sh guards/bin/*.sh guards/tests/*.sh guards/vendor/secret-guard-core/scan.sh)
          echo "Linting: ${files[*]}"
          # -S warning: info-level SC2016 fires on intentional single
          # quotes around jq's own $vars (e.g. '{message: $msg}'), not
          # a real shell-quoting bug — verified locally before adding
          # this gate.
          shellcheck -S warning "${files[@]}"
      - name: credfile-guard tests
        # Generates throwaway keys at run time; nothing real is read.
        run: bash guards/tests/credfile-guard.test.sh
      - name: mcp-output-guard tests
        # Fabricated values only.
        run: bash guards/tests/mcp-output-guard.test.sh
      - name: Bash output hook tests (hot path)
        # Stub service with a slow model scan: proves secrets never wait on it.
        run: bash guards/tests/combined-hook.test.sh
      - name: fast secret-scan path tests
        # Stub service; proves the fast path is used and every failure falls back.
        run: bash guards/tests/fast-secret-scan.test.sh
      - name: publish-guard tests
        # Fabricated credential values only; nothing real is read.
        run: bash guards/tests/publish-guard.test.sh
      - name: hook deadline tests
        # Hung scanner stubs; each hook must answer before its hooks.json timeout.
        # The negative control reads the pre-change hooks from git history.
        env:
          DEADLINE_REQUIRE_CONTROL: "1"
        run: bash guards/tests/hook-deadlines.test.sh

  scan-sh-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the drift check itself (local files, no network)
        # Identical files pass; a one-character difference fails.
        run: bash guards/tests/scan-sh-drift.test.sh
      - name: Vendored scan.sh equals guards-unified app/scan.sh
        # Fetches the server's file (same tag on a tag build, else main).
        # Fails on any difference apart from the two-line vendored header.
        env:
          SERVER_REF: ${{ inputs.server_ref }}
        run: bash guards/tests/scan-sh-drift.sh

  hadolint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint vendored Dockerfile
        # failure-threshold error: fail the build on real errors, not
        # DL30xx style nags (unpinned apt packages, ENV var naming) —
        # verified locally that the current Dockerfile only trips
        # warning-level rules, and a 100%-warnings gate that always
        # fails is as ignorable as no gate at all.
        run: docker run --rm -i hadolint/hadolint hadolint --failure-threshold error - < guards/vendor/secret-guard-core/Dockerfile

  cve-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: Build vendored secret-guard-core image
        run: docker build -t secret-guard-core:ci guards/vendor/secret-guard-core
      - name: Redaction regression test (runs scan.sh inside the built image)
        # Throwaway keys generated at run time; a confirmed secret must
        # never come back unchanged.
        run: SCAN_IMAGE=secret-guard-core:ci bash guards/tests/scan-redaction.test.sh
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: secret-guard-core:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  flag-scheduled-failure:
    needs: [shellcheck, scan-sh-drift, hadolint, cve-scan]
    if: always() && github.event_name == 'schedule' && contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest
    steps:
      - name: Open an issue — don't rely on anyone noticing the red check
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `CI: scheduled lint/CVE scan failed — ${new Date().toISOString().slice(0, 10)}`,
              body: `The weekly scheduled run of [this workflow](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) failed on main with no associated code change — likely a newly-disclosed CVE or a Dockerfile/lint regression surfaced by an upstream base-image update. See the run for details.`,
              labels: ["security", "ci-failure"],
            });
