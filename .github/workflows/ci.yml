name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      server_ref:
        description: "guards-unified branch or tag whose app/scan.sh the drift check compares against (default: main)"
        required: false
        default: ""
  schedule:
    # Weekly, independent of any code change — catches newly-disclosed
    # CVEs in gitleaks / the vendored secret-guard-core image without
    # anyone having to remember to re-run a scan by hand.
    - cron: "0 7 * * 1"

permissions:
  contents: read
  issues: write

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0  # hook-deadlines.test.sh reads the pre-change hooks from history
      - name: Ruff (check and format) on the plugin's Python
        run: |
          python -m pip install ruff==0.17.1
          ruff check .
          ruff format --check .
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Lint hook + vendor scripts
        run: |
          shopt -s nullglob
          files=(guards/hooks/*.sh guards/bin/*.sh guards/tests/*.sh guards/vendor/secret-guard-core/scan.sh)
          echo "Linting: ${files[*]}"
          # -S warning: info-level SC2016 fires on intentional single
          # quotes around jq's own $vars (e.g. '{message: $msg}'), not
          # a real shell-quoting bug — verified locally before adding
          # this gate.
          shellcheck -S warning "${files[@]}"
      - name: credfile-guard tests
        # Generates throwaway keys at run time; nothing real is read.
        run: bash guards/tests/credfile-guard.test.sh
      - name: mcp-output-guard tests
        # Fabricated values only.
        run: bash guards/tests/mcp-output-guard.test.sh
      - name: Bash output hook tests (hot path)
        # Stub service with a slow model scan: proves secrets never wait on it.
        run: bash guards/tests/combined-hook.test.sh
      - name: fast secret-scan path tests
        # Stub service; proves the fast path is used and every failure falls back.
        run: bash guards/tests/fast-secret-scan.test.sh
      - name: no-jq tests (every hook with jq hidden from PATH)
        # Fabricated values only; payloads are built with jq, then the hooks run without it.
        run: bash guards/tests/no-jq.test.sh
      - name: publish-guard tests
        # Fabricated credential values only; nothing real is read.
        run: bash guards/tests/publish-guard.test.sh
      - name: credential classification and path resolution tests
        # The shared classifier, the portable path resolver, the golden
        # old-versus-new comparison (needs the history: fetch-depth 0) and the
        # deadline wrapper without `timeout`, under CPU load.
        run: |
          bash guards/tests/credclass-lib.test.sh
          bash guards/tests/credfile-diff.test.sh
          bash guards/tests/realpath-lib.test.sh
          bash guards/tests/deadline-fallback.test.sh
          bash guards/tests/glob-order.test.sh
      - name: credential-use registry (canaries against the real tools) and the 20-shape battery
        # Every registry row is run against a throwaway credential generated here; the forbidden forms
        # must really print it. The stripper is compared across every awk installed.
        run: |
          sudo apt-get update
          sudo apt-get install -y age gawk mawk busybox
          bash guards/tests/cred-use-registry.test.sh
          bash guards/tests/credfile-battery.test.sh
      - name: outbound-guard tests
        # A throwaway HOME with fabricated credential files, a stub service.
        run: bash guards/tests/outbound-guard.test.sh
      - name: scan.sh bash compatibility (no bash 4 syntax)
        run: bash guards/tests/scan-bash-compat.test.sh
      - name: docs say what the hooks do
        run: bash guards/tests/docs-consistency.test.sh
      - name: hook deadline tests
        # Hung scanner stubs; each hook must answer before its hooks.json timeout.
        # The negative control reads the pre-change hooks from git history.
        env:
          DEADLINE_REQUIRE_CONTROL: "1"
        run: bash guards/tests/hook-deadlines.test.sh
      - name: outbound safe-forms tests
        # Real curl, wget and HTTPie against a localhost listener; fabricated values only.
        # HTTPie is optional: the test reports a SKIP if the install fails.
        run: |
          sudo apt-get install -y curl wget
          sudo apt-get install -y httpie || echo "httpie not installed; its cases will be skipped"
          bash guards/tests/outbound-safeforms.test.sh
      - name: sendmessage-guard tests
        # Stub service and stub scan.sh; fabricated values only.
        run: bash guards/tests/sendmessage-guard.test.sh
      - name: userpromptsubmit-guard tests
        # Stub service; advisory hook must never block.
        run: bash guards/tests/userpromptsubmit-guard.test.sh
      - name: guards-selfheal tests
        # Stub docker/curl/git/timeout/sleep on PATH; no container or network.
        run: bash guards/tests/guards-selfheal.test.sh
      - name: gitleaks install tests (patched download, hash check, upstream fallback)
        # Stub curl serving fixture tarballs; no network. Fabricated binaries.
        run: bash guards/tests/gitleaks-install.test.sh
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: MCP scan tool tests
        # HTTP client stubbed; needs the packages the server imports.
        run: |
          python -m pip install "mcp>=2" httpx
          python guards/tests/mcp-server.test.py
      - name: MCP agent tools and prompts tests
        # Real publish-guard and scan.sh on fabricated values in temp repos; HTTP stubbed or closed.
        run: python -W ignore guards/tests/mcp-tools.test.py

  outbound-parse:
    # The outbound command parser is POSIX awk; awks differ silently (mawk has no
    # regex intervals, one-true-awk and busybox read `word (expr)` as a call).
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        awk: [gawk, mawk, busybox awk]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install the awks
        run: sudo apt-get update && sudo apt-get install -y gawk mawk busybox
      - name: Outbound parser tests (${{ matrix.awk }})
        # Fabricated values only, built at run time; no network.
        env:
          AWKBIN: ${{ matrix.awk }}
        run: bash guards/tests/outbound-parse.test.sh

  outbound-parse-macos:
    # macOS ships one-true-awk. Minimal on purpose: same test, the system awk.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Outbound parser tests (macOS awk)
        env:
          AWKBIN: awk
        run: bash guards/tests/outbound-parse.test.sh

  hooks-macos:
    # macOS has bash 3.2, a BSD userland, no `realpath -m` and no `timeout`. Four
    # bugs only a Mac showed (symlinks not resolved, a lost deny, a bash 4
    # expansion in scan.sh, a slow PATH copy) never ran in CI, which is Linux.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Hook suites under the system bash (3.2)
        env:
          GUARDS_TEST_BUDGET_FACTOR: "2"  # shared runner; the timing budgets pass at 1 on a real Mac
        run: |
          /bin/bash --version | head -1
          failed=""
          for t in scan-bash-compat realpath-lib credclass-lib credfile-guard deadline-fallback credfile-battery cred-use-registry scan-redaction no-jq guards-selfheal publish-guard combined-hook fast-secret-scan mcp-output-guard sendmessage-guard userpromptsubmit-guard hook-deadlines glob-order credfile-diff outbound-guard deny-messages; do
            echo "== $t"
            /bin/bash "guards/tests/$t.test.sh" || failed="$failed $t"
          done
          [ -z "$failed" ] || { echo "FAILED SUITES:$failed"; exit 1; }

  scan-sh-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Check the drift check itself (local files, no network)
        # Identical files pass; a one-character difference fails.
        run: bash guards/tests/scan-sh-drift.test.sh
      - name: Vendored scan.sh equals guards-unified app/scan.sh
        # Fetches the server's file (same tag on a tag build, else main).
        # Fails on any difference apart from the two-line vendored header.
        env:
          SERVER_REF: ${{ inputs.server_ref }}
        run: bash guards/tests/scan-sh-drift.sh
      - name: Vendored gitleaks-assets.sha256 equals guards-unified docs/gitleaks-assets.sha256
        # The hashes the self-heal script checks a patched gitleaks download against must be
        # the ones guards-unified's CI builds hash to (same tag on a tag build, else main).
        env:
          SERVER_REF: ${{ inputs.server_ref }}
        run: bash guards/tests/gitleaks-assets-drift.sh
      - name: Vendored Dockerfile patches the same Go modules as guards-unified Dockerfile.cpu
        # The scan image must fix the modules the server image fixes (same tag on a tag build, else main).
        env:
          SERVER_REF: ${{ inputs.server_ref }}
        run: bash guards/tests/dockerfile-go-drift.sh

  hadolint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Lint vendored Dockerfile
        # failure-threshold error: fail the build on real errors, not
        # DL30xx style nags (unpinned apt packages, ENV var naming) —
        # verified locally that the current Dockerfile only trips
        # warning-level rules, and a 100%-warnings gate that always
        # fails is as ignorable as no gate at all.
        run: docker run --rm -i hadolint/hadolint hadolint --failure-threshold error - < guards/vendor/secret-guard-core/Dockerfile

  cve-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: Build vendored secret-guard-core image
        run: docker build -t secret-guard-core:ci guards/vendor/secret-guard-core
      - name: Redaction regression test (runs scan.sh inside the built image)
        # Throwaway keys generated at run time; a confirmed secret must
        # never come back unchanged.
        run: SCAN_IMAGE=secret-guard-core:ci bash guards/tests/scan-redaction.test.sh
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: secret-guard-core:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  flag-scheduled-failure:
    needs: [shellcheck, scan-sh-drift, hadolint, cve-scan]
    if: always() && github.event_name == 'schedule' && contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest
    steps:
      - name: Open an issue — don't rely on anyone noticing the red check
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `CI: scheduled lint/CVE scan failed — ${new Date().toISOString().slice(0, 10)}`,
              body: `The weekly scheduled run of [this workflow](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) failed on main with no associated code change — likely a newly-disclosed CVE or a Dockerfile/lint regression surfaced by an upstream base-image update. See the run for details.`,
              labels: ["security", "ci-failure"],
            });
