name: Tag check

# claude-plugin-guards and guards-unified are one product in two packages and
# carry the same version and the same tag (see guards-unified's
# docs/RELEASING.md, "Versions move in lockstep"). Plugin installs track main
# and are identified by commit, so a tag here is a label, but a label that
# disagrees with VERSION, or with guards-unified's VERSION, would defeat the point
# of lockstep. Fail loudly. No bot token and no automatic tagging: a person pushes both tags.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  tag-matches-version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Tag equals VERSION here and guards-unified's VERSION
        # guards/ci/tag-version-check.sh; a mismatch, or guards-unified unreachable, fails (re-run the job).
        run: bash guards/ci/tag-version-check.sh "$GITHUB_REF_NAME"
