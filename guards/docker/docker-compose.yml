# guards/docker/docker-compose.yml
#
# ONE service, built from the public gramatr/guards-unified image —
# secret-guard + pii-guard + injection-guard combined into one process,
# one API (POST /v1/scan). Replaces the old three-container stack
# (secret-guard/pii-guard/injection-guard on 8732/8731/8730); same
# consolidation already shipped and CI-verified in
# gramatr/platform-guards#1 — this is that same change applied here.
#
# LOOPBACK-ONLY BY DESIGN — not a config choice to revisit casually.
# guards-unified bundles secret-guard and pii-guard, whose own upstream
# READMEs are explicit: neither may ever be reachable over the
# network, even inside our own boundary — see ../SERVER-SIDE.md before
# changing the port-publish line below.
#
# "127.0.0.1:PORT:PORT", never a bare "PORT:PORT" (which Docker
# publishes on 0.0.0.0) — this is the one line that must never be
# "simplified."

services:
  guards-unified:
    # :cpu, not :gpu — no reason to pull ~4.7GB of unused CUDA runtime
    # by default for a synchronous hook on a local machine. Swap to
    # :gpu only if this host has a GPU and you've measured an actual
    # need for it.
    image: ghcr.io/gramatr/guards-unified:cpu
    ports:
      - "127.0.0.1:8700:8700"
    env_file:
      # Must contain HF_TOKEN=<token with the Llama Prompt Guard 2
      # gated license accepted> — see guards-unified's own README,
      # "The HF_TOKEN problem." Not committed; guards-selfheal.sh
      # creates this file empty (0600) if missing rather than fail the
      # whole stack over one optional capability — the secret/PII
      # findings don't need it, only the injection finding does.
      - ${HOME}/.config/gramatr-guards/injection-guard.env
    volumes:
      # Local-only metrics — one JSON line per finding (timestamp,
      # type, verdict, reason_code), never the scanned text, never
      # transmitted anywhere — see guards-unified's own README,
      # "Local metrics." Mounting this is what makes it survive a
      # container restart instead of vanishing with the ephemeral
      # container filesystem.
      - ${HOME}/.local/share/gramatr-guards/metrics:/app/metrics
    restart: unless-stopped
    mem_limit: 2g
    cpus: 1.0
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8700/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 60s

networks:
  default:
    name: gramatr-guards
    driver: bridge
