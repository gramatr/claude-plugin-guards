# guards/docker/docker-compose.yml
#
# ONE service, built from the public gramatr/guards-unified image —
# secret-guard + pii-guard + injection-guard combined into one process,
# one API (POST /v1/scan). Replaces the old three-container stack
# (secret-guard/pii-guard/injection-guard on 8732/8731/8730).
#
# LOOPBACK-ONLY BY DESIGN — not a config choice to revisit casually.
# guards-unified bundles secret-guard and pii-guard, whose own upstream
# READMEs are explicit: neither may ever be reachable over the
# network, even inside our own boundary — see ../SERVER-SIDE.md before
# changing the port-publish line below.
#
# "127.0.0.1:PORT:PORT", never a bare "PORT:PORT" (which Docker
# publishes on 0.0.0.0) — this is the one line that must never be
# "simplified."

services:
  guards-unified:
    # :cpu, not :gpu — no reason to pull ~4.7GB of unused CUDA runtime
    # by default for a synchronous hook on a local machine. Swap to
    # :gpu only if this host has a GPU and you've measured an actual
    # need for it.
    image: ghcr.io/gramatr/guards-unified:cpu
    ports:
      - "127.0.0.1:8700:8700"
    env_file:
      # Must contain HF_TOKEN=<token with the Llama Prompt Guard 2
      # gated license accepted> — see guards-unified's own README,
      # "The HF_TOKEN problem." Not committed; guards-selfheal.sh
      # creates this file empty (0600) if missing and warns. Without a
      # token the guards-unified service does NOT start (it loads the
      # injection model at startup and exits on the 401), so PII and
      # injection detection are unavailable until a token is added; secret
      # detection continues through the hooks' local fallback.
      #
      # The same file takes the service's PII settings (PII_ENTITIES, PII_MIN_SCORE,
      # PII_IGNORE_NAMES): since server v0.2.10 the default looks only for email,
      # phone, SSN, passport, card and IBAN, not IP addresses, places or names.
      # docs/CONFIGURATION.md has the table and a recorded run.
      - ${HOME}/.config/gramatr-guards/injection-guard.env
    volumes:
      # Local-only metrics — one JSON line per finding (timestamp,
      # type, verdict, reason_code), never the scanned text, never
      # transmitted anywhere — see guards-unified's own README,
      # "Local metrics." Mounting this is what makes it survive a
      # container restart instead of vanishing with the ephemeral
      # container filesystem.
      - ${HOME}/.local/share/gramatr-guards/metrics:/app/metrics
    restart: unless-stopped
    # 2g was getting cgroup-OOM-killed by the kernel shortly after
    # startup (confirmed via dmesg: "Memory cgroup out of memory:
    # Killed process ... (uvicorn)") — loading Presidio's spaCy model
    # plus Prompt Guard 2 at startup, then running both per request,
    # doesn't fit in 2g. `unless-stopped` silently restarts it each
    # time, so from the outside this looked like intermittent
    # unreachability rather than a crash loop. 4g observed comfortably
    # covering both models loaded with normal request traffic.
    mem_limit: 4g
    # 1.0 was the real bottleneck behind what looked like a payload-SIZE
    # scaling cliff: a 20KB /v1/scan request measured as never completing
    # (>60s) at cpus:1.0, confirmed CPU-bound (pinned at 100%+ of the
    # single-core cap throughout, memory never close to its own limit).
    # The work is genuinely parallel -- CPU usage during a request scales
    # with the allocation (measured ~400% at cpus:4, ~800% at cpus:8,
    # consistent with the model using all visible cores) -- so raising
    # this is a real fix, not a band-aid: the same 20KB request measured
    # at 24-44s at cpus:4, 13s at cpus:8, and 5.8-6.4s (consistently) at
    # cpus:16, comfortably inside the hooks' 10s curl timeout. 100KB
    # still takes ~40s even at cpus:16 -- size scales worse than linear,
    # so this does NOT remove the need for SCAN_MAX_BYTES (see
    # combined-hook.sh/sendmessage-guard.sh), it just moves where that
    # cap can safely sit. 16 is a ceiling (CFS quota), not a reservation
    # -- it only competes with this host's other ~32 cores while a scan
    # is actually in flight.
    cpus: 16
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8700/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 60s
    labels:
      # Scopes watchtower (below) to THIS container only -- without
      # --label-enable + this label, watchtower's default behavior is
      # to update every container on the host, which is not
      # acceptable on a shared host that runs other containers.
      - "com.centurylinklabs.watchtower.enable=true"

  # Self-heal's own `docker compose pull` only ever runs at
  # SessionStart -- a running Claude Code session could sit on a
  # stale, already-fixed-upstream image indefinitely until the user
  # quit and restarted, just to pick up a container that has nothing
  # to do with the plugin code a restart actually reloads. Watchtower
  # decouples "the container is current" from "a Claude session
  # happened to restart" entirely: it polls the registry on its own
  # schedule and swaps the container in place (a few seconds of
  # downtime, same as any `docker compose up -d` on a changed image)
  # whether or not anyone's Claude session is even open.
  #
  # containrrr/watchtower is archived (confirmed 2026-10-19); this is
  # the actively maintained fork.
  watchtower:
    image: nickfedor/watchtower:1.23.1
    volumes:
      # Full docker.sock access is watchtower's whole mechanism, not
      # an oversight -- it needs the daemon API to inspect, pull, and
      # recreate containers. WATCHTOWER_LABEL_ENABLE below is a
      # policy filter on what IT chooses to act on, not a kernel-level
      # restriction on what the socket itself permits; the trust
      # boundary here is "this image is actively maintained and we
      # pin an exact version," the same posture as everything else in
      # this stack (gitleaks, uv, etc.), not a stronger guarantee.
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - WATCHTOWER_LABEL_ENABLE=true
      # 5 minutes -- real releases are rare (hours to weeks apart,
      # not minutes), so this costs nothing most of the time; it just
      # means a fix is live within 5 minutes of being published
      # instead of whenever someone next happens to restart Claude
      # Code.
      - WATCHTOWER_POLL_INTERVAL=300
      # Otherwise every update leaves the previous image sitting on
      # disk forever -- this stack has already accumulated several
      # multi-GB tags in one day of real releases.
      - WATCHTOWER_CLEANUP=true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

networks:
  default:
    name: gramatr-guards
    driver: bridge
